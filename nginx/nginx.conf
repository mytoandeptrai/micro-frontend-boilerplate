load_module "modules/ngx_http_brotli_filter_module.so";
load_module "modules/ngx_http_brotli_static_module.so";

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" rt=$request_time cache=$upstream_cache_status';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # Writable temp dirs for the non-root nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;

    # Secondary edge cache in front of the app containers. Respects each
    # app's own Cache-Control (no-cache on remoteEntry.js/mf-manifest.json
    # is honored automatically — see apps/*/nginx.conf), this just adds a
    # bound on how long an otherwise-cacheable response is kept.
    proxy_cache_path /var/cache/nginx/proxy_cache levels=1:2 keys_zone=static_cache:10m max_size=200m inactive=60m use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_status 429;

    upstream shell_upstream {
        server shell:8080;
        keepalive 32;
    }

    upstream first_app_upstream {
        server first-app:8080;
        keepalive 32;
    }

    upstream second_app_upstream {
        server second-app:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        limit_req zone=general burst=40 nodelay;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Convenience redirects so a bare "/first-app" (no trailing slash)
        # doesn't fall through to the "/" location below.
        location = /first-app { return 301 /first-app/; }
        location = /second-app { return 301 /second-app/; }

        location /first-app/ {
            proxy_pass http://first_app_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache static_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating;
        }

        location /second-app/ {
            proxy_pass http://second_app_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache static_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating;
        }

        location / {
            proxy_pass http://shell_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
