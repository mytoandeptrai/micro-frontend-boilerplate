name: E2E

on:
  push:
    branches: [base-app]
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Set up env files
        run: |
          cp apps/shell/.env.example apps/shell/.env.local
          cp apps/first-app/.env.example apps/first-app/.env.local
          cp apps/second-app/.env.example apps/second-app/.env.local
      - name: Install Playwright browsers
        run: pnpm --filter @ops/shell exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/shell/playwright-report/
          retention-days: 7
