name: Setup pnpm + Node + Turbo cache
description: Install pnpm, Node 20, workspace dependencies, and cache the pnpm store + Turborepo cache

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: Cache Turborepo
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
